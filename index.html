<!DOCTYPE html>
<html>
<head>
  <title>For You 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Promise Screen -->
<div id="startScreen" class="center">
  <h1>Hey Vickyluh ❤️</h1>
  <p>Before you answer anything, promise you will read till the end 💕</p>
  <button onclick="start()">I Promise 💖</button>
</div>

<!-- Question Screen -->
<div id="qBox" class="center hidden">
  <h2 id="question"></h2>

  <div class="btns">
    <button id="yesBtn" onclick="nextYes()">Yes ❤️</button>
    <button id="noBtn" onclick="noClick()">No 😶</button>
  </div>

  <p id="msg"></p>
</div>

<!-- Final Screen -->
<div id="finalScreen" class="center hidden">
  <h1>💍 Will You Marry Me? 💍</h1>
  <p>You're the best thing that ever happened to me ❤️</p>
</div>

<script src="script.js"></script>
</body>
</html>
