<!DOCTYPE html>
<html>
<head>
  <title>For You 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="loader" id="loader">
    <h1>Loading our story... 💖</h1>
  </div>

  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="hearts"></div>

  <div class="container hidden" id="main">
    <h1 class="glow typewriter">Hey You 💕</h1>

    <p class="fade">I’ve been wanting to tell you something...</p>

    <h2 class="bounce">Will you marry me? 💍</h2>

    <button class="yes" onclick="yesClick()">Yes 💖</button>
    <button class="no" id="noBtn">No 😶</button>

    <p id="msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
